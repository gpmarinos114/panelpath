services:
  panelpath:
    image: ghcr.io/gpmarinos114/panelpath:latest
    # …or build from source instead:
    # build: .
    ports:
      - "5175:5175"
    volumes:
      - panelpath-data:/data
    environment:
      - DATA_DIR=/data
      - PROGRESS_FILE=/data/progress.json
      - TZ=America/New_York
      # Optional: enables the in-app "Connect with GitHub" device flow for submitting orders.
      # - GITHUB_CLIENT_ID=your_oauth_app_client_id
    restart: unless-stopped

volumes:
  panelpath-data:
