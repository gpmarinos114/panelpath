name: validate-orders
on:
  pull_request:
    paths:
      - "data/orders/**.json"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate changed order files
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1 || true
          FILES=$(git diff --name-only --diff-filter=ACM "origin/${{ github.base_ref }}...HEAD" -- 'data/orders/*.json' | tr '\n' ' ')
          echo "changed: $FILES"
          node tools/validate-order.mjs $FILES
